version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24

  node_with_database:
    docker:
      - image: cimg/node:24
      # Base jetable, propre au job : CircleCI ne transmet pas les variables du projet aux conteneurs
      # secondaires, d'où l'authentification sans mot de passe.
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: otelo
          POSTGRES_DB: otelo-test
          POSTGRES_HOST_AUTH_METHOD: trust

parameters:
  lockfile:
    type: string
    default: './pnpm-lock.yaml'
  virtual_store_dir:
    type: string
    default: '.pnpm-store'
  cache_version:
    type: string
    default: 'v1'

workflows:
  version: 2
  otelo:
    jobs:
      - lint
      - test_api
      - test_api_integration
      - test_api_e2e
      - build_api
      - build_web

jobs:
  lint:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - run:
          name: 'Lint'
          command: pnpm lint

  # Les jobs de test ne compilent pas @otelo/shared : les configs jest le résolvent vers ses sources.
  test_api:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - prisma_generate
      - run:
          name: 'Test API'
          command: pnpm -F api test

  test_api_integration:
    # INTEGRATION_DATABASE_URL est définie dans les variables d'environnement du projet CircleCI.
    executor: node_with_database
    steps:
      - run:
          name: 'Check INTEGRATION_DATABASE_URL'
          command: '[ -n "$INTEGRATION_DATABASE_URL" ] || { echo "INTEGRATION_DATABASE_URL manque dans les variables du projet CircleCI"; exit 1; }'
      - checkout
      - install_dependencies
      - prisma_generate
      - run:
          name: 'Wait for database'
          command: |
            for _ in $(seq 1 30); do
              nc -z localhost 5432 && exit 0
              sleep 1
            done
            echo 'Postgres injoignable après 30 s' && exit 1
      - run:
          name: 'Integration tests API'
          command: pnpm -F api test:integration

  # Lance un vrai Chrome pour l'export PowerPoint. Les bibliothèques système sont
  # celles de l'Aptfile, comme au build Scalingo : un paquet retiré à tort casse ici.
  test_api_e2e:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - prisma_generate
      # Seules les sources Ubuntu main/universe sont lues : l'image déclare aussi Docker, git-lfs
      # et un PPA git, et l'index complet coûtait ~25 s de `apt-get update` à chaque exécution.
      - run:
          name: "Bibliothèques système de l'Aptfile"
          command: |
            mkdir -p /tmp/apt-sources
            cat > /tmp/apt-sources/ubuntu.sources \<<EOF
            Types: deb
            URIs: http://archive.ubuntu.com/ubuntu/
            Suites: $(. /etc/os-release && echo "$VERSION_CODENAME $VERSION_CODENAME-updates")
            Components: main universe
            Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

            Types: deb
            URIs: http://security.ubuntu.com/ubuntu/
            Suites: $(. /etc/os-release && echo "$VERSION_CODENAME-security")
            Components: main universe
            Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
            EOF
            APT_OPTS='-o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts=/tmp/apt-sources -o Acquire::Languages=none'
            sudo apt-get update $APT_OPTS
            xargs -a Aptfile sudo apt-get install -y --no-install-recommends $APT_OPTS
      - run:
          name: 'Install chrome-headless-shell'
          command: pnpm -F api exec puppeteer browsers install chrome-headless-shell
      - run:
          name: 'E2E tests API'
          command: pnpm -F api test:e2e

  build_api:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - prisma_generate
      - run:
          name: 'Build shared'
          command: pnpm build:shared
      - run:
          name: 'Build API'
          command: pnpm build:api

  build_web:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - create_dotenv_file
      - run:
          name: 'Build shared'
          command: pnpm build:shared
      - run:
          name: 'Build Web'
          command: pnpm build:web

commands:
  install_pnpm:
    steps:
      - run:
          name: 'Install pnpm via corepack'
          command: |
            # L'image livre un pnpm dans /usr/local/bin appartenant à root : sans sudo,
            # corepack ne peut pas le remplacer par son propre lien.
            sudo corepack enable
            corepack prepare --activate

  install_dependencies:
    steps:
      - install_pnpm
      # La clé de repli reprend le cache d'un autre lockfile : pnpm n'installe alors que l'écart.
      - restore_cache:
          keys:
            - << pipeline.parameters.cache_version >>-pnpm-{{ checksum "<< pipeline.parameters.lockfile >>" }}
            - << pipeline.parameters.cache_version >>-pnpm-
      - run:
          name: 'Install dependencies'
          command: pnpm install --virtual-store-dir << pipeline.parameters.virtual_store_dir >> --frozen-lockfile
      # Sans effet quand la clé existe déjà ; le premier job qui finit l'installation l'écrit.
      - save_cache:
          key: << pipeline.parameters.cache_version >>-pnpm-{{ checksum "<< pipeline.parameters.lockfile >>" }}
          paths:
            - << pipeline.parameters.virtual_store_dir >>
            - ./node_modules

  prisma_generate:
    steps:
      - run:
          name: 'Prisma generate'
          command: pnpm --filter @otelo/api exec prisma generate

  create_dotenv_file:
    steps:
      - run:
          name: 'Create .env file from .env.dist'
          command: cp apps/web/.env.dist apps/web/.env
