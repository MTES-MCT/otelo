packages:
  - apps/*
  - packages/*

catalog:
  '@biomejs/biome': 2.3.13
  '@types/node': ^25.9.9
  dayjs: ^1.11.23
  typescript: ^5.9.3
  zod: ^4.6.7

minimumReleaseAge: 10080

# Correctif de sécurité better-auth (GHSA du 2026-11-03) : exemption limitée à ces versions exactes.
minimumReleaseAgeExclude:
  - better-auth@1.7.16
  - '@better-auth/core@1.7.16'
  - '@better-auth/drizzle-adapter@1.7.16'
  - '@better-auth/kysely-adapter@1.7.16'
  - '@better-auth/memory-adapter@1.7.16'
  - '@better-auth/mongo-adapter@1.7.16'
  - '@better-auth/prisma-adapter@1.7.16'
  - '@better-auth/telemetry@1.7.16'
  - better-call@1.4.5

allowBuilds:
  '@scarf/scarf': false
  '@gouvfr/dsfr': false
  '@parcel/watcher': false
  '@prisma/client': false
  '@prisma/engines': false
  argon2: false
  esbuild: false
  prisma: false
  puppeteer: false
  unrs-resolver: false

overrides:
  '@prisma/config>deepmerge-ts': 8.0.0
  'exceljs>uuid': 11.1.1
  'tsup>esbuild': 0.28.1
  multer: '>=2.3.0'
  '@nestjs/swagger>js-yaml': 5.4.3
